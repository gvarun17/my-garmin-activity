# my-garmin-activity - InfluxDB + Grafana + one-shot sync service.
# The sync service is in the "sync" profile: it runs once and exits.
# Run it with: docker compose --profile sync run --rm sync --days 7
# Versions are pinned on purpose. Do not change them to :latest
# without checking the InfluxDB v2 vs v3 setup difference first.
services:
  influxdb:
    image: influxdb:2.7
    container_name: my-garmin-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_INIT_USERNAME:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_INIT_PASSWORD:-change-me-in-env}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-garmin}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-fitness}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-change-me-in-env}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: grafana/grafana:11.4.3
    container_name: my-garmin-grafana
    restart: unless-stopped
    depends_on:
      influxdb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-in-env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  sync:
    build: .
    profiles: ["sync"]
    depends_on:
      influxdb:
        condition: service_healthy
    env_file: .env
    environment:
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG:-garmin}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET:-fitness}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN:-change-me-in-env}
    volumes:
      - ./data:/app/data

volumes:
  influxdb-data:
  grafana-data:
